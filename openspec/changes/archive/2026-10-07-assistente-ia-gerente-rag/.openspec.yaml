author: "Antigravity AI & Rafael"
description: >
  Implementação do Assistente IA para o perfil Gerente utilizando RAG estruturado sobre SQLite,
  ontologia relacional de domínio (setores, turnos e sinônimos), conexão segura somente leitura (mode=ro),
  catálogo analítico Pydantic, descoberta dinâmica e fallback em cascata com Google Gemini (google-genai).
